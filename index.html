<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Frankie Bell</title>
<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#F5F0E6;
}
header{
  text-align:center;
  padding:40px;
}
h1{
  font-size:48px;
  margin:10px;
}
p{color:#555;}
.container{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:20px;
  padding:20px;
}
.card{
  width:280px;
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,.15);
}
.image{
  height:160px;
  background:linear-gradient(135deg,#2563eb,#0f172a);
}
.content{
  padding:18px;
}
button{
  width:100%;
  padding:12px;
  background:#d99b19;
  color:white;
  border:none;
  border-radius:10px;
  font-weight:bold;
}
footer{
  text-align:center;
  padding:30px;
}
</style>
</head>
<body>

<header>
  <h1>👑 Frankie Bell</h1>
  <p>Free Roblox UI • Systems • Assets</p>
</header>

<div class="container">

<div class="card">
  <div class="image"></div>
  <div class="content">
    <h2>Admin Panel</h2>
    <p>Professional Roblox GUI.</p>
    <button>Download</button>
  </div>
</div>

<div class="card">
  <div class="image"></div>
  <div class="content">
    <h2>Notification System</h2>
    <p>Animated notifications.</p>
    <button>Download</button>
  </div>
</div>

<div class="card">
  <div class="image"></div>
  <div class="content">
    <h2>Kick System</h2>
    <p>Private server tools.</p>
    <button>Download</button>
  </div>
</div>

</div>

<footer>
© 2026 Frankie Bell
</footer>

</body>
</html>
